name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - resume.json
      - scripts/build_resume.py
      - .github/workflows/build-resume.yml

permissions:
  contents: write

concurrency:
  group: resume-pdf-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PDF dependency
        run: python -m pip install reportlab==4.4.9

      - name: Build resume PDFs
        run: |
          PRIMARY=Constantine_Yachnytskyi_Go_Rust_Backend_Distributed_Systems_Engineer.pdf
          LEGACY=Constantine_Yachnytskyi_Golang_Rust_Engineer.pdf
          python scripts/build_resume.py resume.json "$PRIMARY"
          cp "$PRIMARY" "$LEGACY"

      - name: Commit rebuilt PDFs
        run: |
          PRIMARY=Constantine_Yachnytskyi_Go_Rust_Backend_Distributed_Systems_Engineer.pdf
          LEGACY=Constantine_Yachnytskyi_Golang_Rust_Engineer.pdf
          if git diff --quiet -- "$PRIMARY" "$LEGACY"; then
            echo "Resume PDFs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PRIMARY" "$LEGACY"
          git commit -m "Rebuild resume PDFs"
          git push origin HEAD:main
